<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My assessments – Bail Reckoner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <div id="list-view">
      <section class="hero"><h1>My assessments</h1><p>Assessments you ran while logged in are saved here.</p></section>
      <div id="history-list"><p class="empty">Loading…</p></div>
    </div>
    <div id="detail-view" class="hidden">
      <p class="no-print"><button type="button" class="btn btn-ghost btn-sm" id="back-list">← Back to list</button></p>
      <div id="detail"></div>
      <div class="result-actions"><button type="button" class="btn btn-primary" id="print-btn">Print / Save as PDF</button></div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/api.js"></script>
  <script src="/js/results.js"></script>
  <script src="/js/history.js"></script>
</body>
</html>
